<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esperimenti Pratici Probabilità</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 40px;
            text-align: center;
        }

        .header h1 {
            color: #1a1a1a;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: #666;
            font-size: 15px;
        }

        .tabs {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 15px 30px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #1a1a1a;
        }

        .tab.active {
            color: #1e3a5f;
            border-bottom-color: #1e3a5f;
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .simulator {
            display: none;
            background: white;
            border-radius: 2px;
            padding: 50px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .simulator.active {
            display: block;
        }

        .simulator h2 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 1px;
            font-size: 16px;
            transition: all 0.2s;
            background: #fafafa;
            color: #1a1a1a;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e3a5f;
            background: white;
        }

        button.calc-btn {
            width: 100%;
            padding: 16px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 1px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.calc-btn:hover {
            background: #152a45;
        }

        button.calc-btn:active {
            transform: scale(0.98);
        }

        .chart-container {
            position: relative;
            height: 450px;
            margin-top: 40px;
            display: none;
            padding: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 1px;
            background: white;
        }

        .chart-container.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            display: none;
        }

        .stats-grid.show {
            display: grid;
        }

        .stat-card {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 25px;
            border-radius: 1px;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: #1e3a5f;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 300;
            color: #1e3a5f;
        }

        .dartboard-container {
            display: none;
            margin-top: 40px;
        }

        .dartboard-container.show {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .dartboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dartboard {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid #e0e0e0;
            background: white;
        }

        .dartboard svg {
            width: 100%;
            height: 100%;
        }

        .dart-stats {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            padding: 12px 16px;
            background: #ffebee;
            border-left: 3px solid #d32f2f;
            border-radius: 1px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 900px) {
            .simulator {
                padding: 30px;
            }

            .inputs-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .dartboard-container.show {
                grid-template-columns: 1fr;
            }

            .dartboard {
                width: 100%;
                max-width: 400px;
                height: auto;
                aspect-ratio: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Esperimenti Pratici Probabilità</h1>
        <p class="subtitle">Esplora le probabilità attraverso simulazioni casuali</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('dice')">Dadi</button>
        <button class="tab" onclick="switchTab('darts')">Freccette</button>
    </div>

    <div class="content">
        <!-- SIMULATORE DADI -->
        <div id="dice-simulator" class="simulator active">
            <h2>Probabilità dei Dadi</h2>
            
            <div class="inputs-row">
                <div class="input-group">
                    <label for="numDice">Numero di dadi</label>
                    <input type="number" id="numDice" min="1" max="10" value="2">
                </div>

                <div class="input-group">
                    <label for="numRolls">Numero di tiri</label>
                    <input type="number" id="numRolls" min="1" max="1000000" value="10000">
                </div>
            </div>

            <button class="calc-btn" onclick="calculateDice()">Calcola probabilità</button>

            <div class="error" id="dice-error"></div>

            <div class="stats-grid" id="dice-stats">
                <div class="stat-card">
                    <div class="stat-label">Somma Minima</div>
                    <div class="stat-value" id="minSum">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Somma Massima</div>
                    <div class="stat-value" id="maxSum">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Più Probabile</div>
                    <div class="stat-value" id="mostProbable">-</div>
                </div>
            </div>

            <div class="chart-container" id="dice-chart">
                <canvas id="diceChart"></canvas>
            </div>
        </div>

        <!-- SIMULATORE FRECCETTE -->
        <div id="darts-simulator" class="simulator">
            <h2>Simulatore Freccette</h2>
            
            <div class="inputs-row">
                <div class="input-group">
                    <label for="numDarts">Numero di freccette</label>
                    <input type="number" id="numDarts" min="1" max="10000" value="1000">
                </div>

                <div class="input-group">
                    <label for="accuracy">Precisione del giocatore</label>
                    <select id="accuracy">
                        <option value="beginner">Principiante (alta dispersione)</option>
                        <option value="intermediate" selected>Intermedio (media dispersione)</option>
                        <option value="expert">Esperto (bassa dispersione)</option>
                        <option value="pro">Professionista (minima dispersione)</option>
                    </select>
                </div>
            </div>

            <button class="calc-btn" onclick="calculateDarts()">Lancia freccette</button>

            <div class="error" id="darts-error"></div>

            <div class="dartboard-container" id="dartboard-container">
                <div class="dartboard-wrapper">
                    <div class="dartboard" id="dartboard">
                        <svg viewBox="0 0 400 400">
                            <!-- Cerchi del bersaglio -->
                            <circle cx="200" cy="200" r="180" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                            <circle cx="200" cy="200" r="140" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                            <circle cx="200" cy="200" r="100" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                            <circle cx="200" cy="200" r="60" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                            <circle cx="200" cy="200" r="20" fill="#1e3a5f" stroke="#1a1a1a" stroke-width="2"/>
                            
                            <!-- Container per le freccette -->
                            <g id="darts-layer"></g>
                        </svg>
                    </div>
                </div>

                <div class="dart-stats">
                    <div class="stat-card">
                        <div class="stat-label">Bullseye (Centro)</div>
                        <div class="stat-value" id="bullseye">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Cerchio Interno</div>
                        <div class="stat-value" id="inner">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Cerchio Medio</div>
                        <div class="stat-value" id="middle">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Cerchio Esterno</div>
                        <div class="stat-value" id="outer">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Fuori Bersaglio</div>
                        <div class="stat-value" id="miss">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let diceChart = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.simulator').forEach(s => s.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-simulator').classList.add('active');
        }

        function calculateDice() {
            const numDice = parseInt(document.getElementById('numDice').value);
            const numRolls = parseInt(document.getElementById('numRolls').value);
            const errorDiv = document.getElementById('dice-error');
            const chartContainer = document.getElementById('dice-chart');
            const statsGrid = document.getElementById('dice-stats');

            errorDiv.classList.remove('show');
            chartContainer.classList.remove('show');
            statsGrid.classList.remove('show');

            if (isNaN(numDice) || numDice < 1 || numDice > 10) {
                errorDiv.textContent = 'Inserisci un numero di dadi valido (1-10)';
                errorDiv.classList.add('show');
                return;
            }

            if (isNaN(numRolls) || numRolls < 1 || numRolls > 1000000) {
                errorDiv.textContent = 'Inserisci un numero di tiri valido (1-1,000,000)';
                errorDiv.classList.add('show');
                return;
            }

            const minSum = numDice;
            const maxSum = numDice * 6;
            const counts = {};

            for (let i = minSum; i <= maxSum; i++) {
                counts[i] = 0;
            }

            for (let roll = 0; roll < numRolls; roll++) {
                let sum = 0;
                for (let d = 0; d < numDice; d++) {
                    sum += Math.floor(Math.random() * 6) + 1;
                }
                counts[sum]++;
            }

            const labels = [];
            const data = [];
            let maxProb = 0;
            let mostProbableSum = minSum;

            for (let sum = minSum; sum <= maxSum; sum++) {
                const probability = (counts[sum] / numRolls * 100);
                labels.push(sum.toString());
                data.push(probability);
                
                if (probability > maxProb) {
                    maxProb = probability;
                    mostProbableSum = sum;
                }
            }

            document.getElementById('minSum').textContent = minSum;
            document.getElementById('maxSum').textContent = maxSum;
            document.getElementById('mostProbable').textContent = mostProbableSum;

            if (diceChart) {
                diceChart.destroy();
            }

            const ctx = document.getElementById('diceChart').getContext('2d');
            diceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Probabilità (%)',
                        data: data,
                        backgroundColor: 'rgba(30, 58, 95, 0.85)',
                        borderColor: 'rgba(30, 58, 95, 1)',
                        borderWidth: 0,
                        borderRadius: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: `Distribuzione delle Probabilità — ${numRolls.toLocaleString()} tiri`,
                            font: {
                                size: 14,
                                weight: '500'
                            },
                            color: '#1a1a1a',
                            padding: {
                                bottom: 30
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1a1a1a',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y.toFixed(2);
                                    const count = counts[parseInt(context.label)];
                                    return [
                                        `Probabilità: ${value}%`,
                                        `Occorrenze: ${count.toLocaleString()}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'PROBABILITÀ (%)',
                                font: {
                                    size: 11,
                                    weight: '500'
                                },
                                color: '#666'
                            },
                            grid: {
                                color: '#f0f0f0',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#666',
                                font: {
                                    size: 11
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'SOMMA DEI DADI',
                                font: {
                                    size: 11,
                                    weight: '500'
                                },
                                color: '#666'
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#666',
                                font: {
                                    size: 11
                                }
                            }
                        }
                    }
                }
            });

            chartContainer.classList.add('show');
            statsGrid.classList.add('show');
        }

        function calculateDarts() {
            const numDarts = parseInt(document.getElementById('numDarts').value);
            const accuracy = document.getElementById('accuracy').value;
            const errorDiv = document.getElementById('darts-error');
            const container = document.getElementById('dartboard-container');

            errorDiv.classList.remove('show');

            if (isNaN(numDarts) || numDarts < 1 || numDarts > 10000) {
                errorDiv.textContent = 'Inserisci un numero di freccette valido (1-10,000)';
                errorDiv.classList.add('show');
                return;
            }

            // Deviazione standard basata sulla precisione
            const stdDevMap = {
                'beginner': 80,
                'intermediate': 50,
                'expert': 30,
                'pro': 15
            };
            const stdDev = stdDevMap[accuracy];

            // Contatori
            let bullseye = 0, inner = 0, middle = 0, outer = 0, miss = 0;

            // Pulisci le freccette precedenti
            const dartsLayer = document.getElementById('darts-layer');
            dartsLayer.innerHTML = '';

            // Lancia le freccette
            for (let i = 0; i < numDarts; i++) {
                // Genera coordinate con distribuzione normale (Box-Muller)
                const u1 = Math.random();
                const u2 = Math.random();
                const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                const z1 = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);

                const x = 200 + z0 * stdDev;
                const y = 200 + z1 * stdDev;

                // Calcola distanza dal centro
                const distance = Math.sqrt((x - 200) ** 2 + (y - 200) ** 2);

                // Classifica la freccetta
                if (distance <= 20) {
                    bullseye++;
                } else if (distance <= 60) {
                    inner++;
                } else if (distance <= 100) {
                    middle++;
                } else if (distance <= 180) {
                    outer++;
                } else {
                    miss++;
                }

                // Disegna la freccetta (solo le prime 1000 per performance)
                if (i < 1000) {
                    const dart = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dart.setAttribute('cx', x);
                    dart.setAttribute('cy', y);
                    dart.setAttribute('r', '1.5');
                    dart.setAttribute('fill', '#1e3a5f');
                    dart.setAttribute('opacity', '0.6');
                    dartsLayer.appendChild(dart);
                }
            }

            // Aggiorna le statistiche
            document.getElementById('bullseye').textContent = bullseye + ' (' + (bullseye / numDarts * 100).toFixed(1) + '%)';
            document.getElementById('inner').textContent = inner + ' (' + (inner / numDarts * 100).toFixed(1) + '%)';
            document.getElementById('middle').textContent = middle + ' (' + (middle / numDarts * 100).toFixed(1) + '%)';
            document.getElementById('outer').textContent = outer + ' (' + (outer / numDarts * 100).toFixed(1) + '%)';
            document.getElementById('miss').textContent = miss + ' (' + (miss / numDarts * 100).toFixed(1) + '%)';

            container.classList.add('show');
        }
    </script>
</body>
</html>
